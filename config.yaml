# Multi-Agent Programming Task Solver Configuration

# API Keys Configuration
api_keys:
  # Google Gemini API Key - FREE TIER AVAILABLE!
  # Get yours at: https://aistudio.google.com/app/apikey
  google: ""

# Model Configuration for Each Agent
# FORMAT: "google:model-name"
#
# Available Google Gemini Models (FREE TIER):
# It has a generous free tier for APIs, can start from here. (Details: https://ai.google.dev/gemini-api/docs/rate-limits)
#   - "google:gemini-2.5-pro"           # Most capable, slower (100 free requests / day) - winning model
#   - "google:gemini-2.5-flash"         # Latest & fastest (250 free requests / day)
#   - "google:gemini-2.5-flash-lite"    # Fast & Cheap (1000 free requests / day) - good for testing
# gemini-3-pro-preview
models:
  tester_agent: "google:gemini-2.5-flash"    
  brute_agent: "google:gemini-2.5-pro"     
  optimal_agent: "google:gemini-2.5-pro"
  # Optional: Model for comprehensive test generation (defaults to tester_agent if not specified)
  comprehensive_test_agent: "google:gemini-2.5-flash"   

# Language Configuration
# Supported languages: python, java, cpp
language: "java"  # Options: python, java, cpp

# Execution Parameters
execution:
  max_optimal_attempts: 3
  timeout_seconds: 30  # Timeout for code execution

# Problem Input Configuration
# All problem-related files (statement, sample inputs/outputs, images) are in the problem folder
problem:
  folder: "./problem"  # Path to the problem folder
  statement: "statement.txt"  # Problem statement file name
  sample_input: "sample_in.txt"  # Sample input file name (optional)
  sample_output: "sample_out.txt"  # Sample output file name (optional)
  # Image file patterns - will search for files matching these patterns in the problem folder
  # Supports glob patterns like "img_*.jpg", "*.png", etc.
  image_patterns:
    - "img_*.jpg"
    - "img_*.jpeg"
    - "img_*.png"
    - "img_*.gif"
    - "img_*.webp"

# Output Configuration
output:
  workspace_dir: "./workspace"
  preserve_intermediate: true  # Keep all generated files

# File Names (extensions will be auto-set based on language)
files:
  test_inputs: "small_inputs.txt"
  brute_solution: "brute"  # Extension added automatically
  brute_outputs: "small_outputs.txt"
  optimal_solution: "optimal"  # Extension added automatically
  optimal_outputs: "op.txt"
